<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chọn Sản Phẩm & Thanh toán</title>
    <!-- html2canvas library for screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        /* Main container cho phần nhập liệu */
        .container {
            max-width: 950px;
            width: 100%;
            margin: 0 auto 24px auto;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 24px 28px;
            transition: all 0.2s;
        }

        h1, h2 {
            text-align: center;
            color: #1e466e;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Khu vực thông tin khách hàng */
        .customer-input-section {
            background: #f9fafc;
            padding: 18px 20px;
            border-radius: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-between;
        }
        .customer-input-section div {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .customer-input-section label {
            font-weight: 700;
            color: #1e3a5f;
            min-width: 100px;
            font-size: 1rem;
        }
        .customer-input-section input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.95rem;
            background: white;
            transition: 0.2s;
        }
        .customer-input-section input:focus {
            border-color: #0077b6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,119,182,0.2);
        }

        /* Product list header & items - giao diện bảng chắc chắn */
        .product-list-header, .product-item {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .product-list-header {
            background-color: #eef2ff;
            padding: 14px 12px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-weight: 800;
            color: #0b2b44;
            border-bottom: 2px solid #cbdff2;
        }

        .product-item {
            background: white;
            padding: 12px 12px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.1s;
        }
        .product-item:hover {
            background-color: #fefce8;
        }

        /* Các cột đồng nhất */
        .name-header, .name-field { flex: 2.2; min-width: 130px; }
        .quantity-header, .quantity-field { flex: 0.8; min-width: 85px; text-align: center; }
        .price-header, .price-field { flex: 1; min-width: 110px; text-align: center; }
        .remove-header { flex: 0.5; min-width: 60px; text-align: center; }
        .remove-product-button { flex: 0.5; min-width: 60px; }

        .product-field input {
            width: 100%;
            padding: 12px 8px;
            border: 1px solid #cbd5e6;
            border-radius: 14px;
            font-size: 0.9rem;
            background: white;
            text-align: center;
            font-weight: 500;
        }
        .product-field input:focus {
            border-color: #2c6e9e;
            outline: none;
            box-shadow: 0 0 0 2px rgba(44,110,158,0.2);
        }

        .remove-product-button {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            width: 100%;
            text-align: center;
        }
        .remove-product-button:hover {
            background-color: #b91c1c;
            transform: scale(0.97);
        }

        .add-product-button {
            background: #ffb347;
            background: linear-gradient(95deg, #f59e0b, #f97316);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            margin-top: 24px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .add-product-button:hover {
            background: linear-gradient(95deg, #e67e22, #fd7e14);
            transform: translateY(-2px);
        }

        .calculate-button {
            background: #2b6e4c;
            background: linear-gradient(95deg, #15803d, #16a34a);
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.3rem;
            color: white;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .calculate-button:hover {
            background: linear-gradient(95deg, #0f5c38, #15803d);
            transform: translateY(-2px);
        }

        /* ========== PHIẾU XUẤT KHO - PHẦN HIỂN THỊ ========== */
        .summary-section {
            display: none;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            padding: 28px 32px;
        }

        /* Header phiếu - KÍCH THƯỚC NHỎ HƠN */
        .summary-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 14px;
        }
        .summary-header .company-name {
            font-size: 2.0rem;
            font-weight: 800;
            color: #b91c1c;
            letter-spacing: 0.5px;
        }
        .summary-header .branch-info {
            font-size: 1.1rem;
            font-weight: 700;
            color: #b45309;
        }
        .contact-info {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e66;
            margin-top: 4px;
        }
        .doc-title {
            font-size: 2.4rem !important;
            font-weight: 900 !important;
            color: #0f3b5c;
            margin: 10px 0 8px 0;
            letter-spacing: 1px;
            border-bottom: 2px dashed #ccc;
            display: inline-block;
            padding-bottom: 4px;
        }

        /* Thông tin khách + ngày - KÍCH THƯỚC NHỎ HƠN */
        .customer-and-date-details {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 12px 18px;
            border-radius: 20px;
            margin: 12px 0 6px 0;
            font-size: 1.2rem;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 10px;
        }
        .customer-and-date-details div {
            font-size: 1.1rem;
        }
        #summaryCustomerName, #summarySaleDate {
            font-weight: 800;
            color: #0f172a;
            background: #eef2ff;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* ========== DANH SÁCH SẢN PHẨM DẠNG BLOCK ========== */
        .summary-products {
            margin: 16px 0;
        }

        .product-block {
            border-bottom: 2px solid #1e293b;
            padding: 14px 0;
            margin-bottom: 0;
        }

        .product-block:last-child {
            border-bottom: none;
        }

        .product-block .product-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b2b44;
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .product-block .product-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
        }

        .product-block .product-details .detail-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .product-block .product-details .label {
            font-weight: 400;
            color: #475569;
            font-size: 1.0rem;
        }

        .product-block .product-details .value {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
        }

        .product-block .product-details .price-col {
            text-align: left;
            flex: 0 0 30%;
        }

        .product-block .product-details .price-col .value {
            font-size: 1.3rem;
        }

        .product-block .product-details .qty-col {
            text-align: center;
            flex: 0 0 20%;
        }

        .product-block .product-details .qty-col .label {
            font-size: 1.2rem;
            font-weight: 400;
            color: #475569;
        }

        .product-block .product-details .qty-col .value {
            font-size: 1.3rem;
        }

        /* ===== THÀNH TIỀN - LUÔN CANH PHẢI ===== */
        .product-block .product-details .subtotal-col {
            text-align: right !important;
            flex: 0 0 30%;
            font-weight: 800;
            color: #b45309;
            font-size: 1.4rem;
            justify-content: flex-end;
        }

        /* Đảm bảo canh phải cả trên điện thoại */
        @media (max-width: 750px) {
            .product-block .product-details .subtotal-col {
                text-align: right !important;
                flex: 0 0 35%;
                font-size: 0.95rem;
                justify-content: flex-end;
            }
        }

        /* Tổng tiền - NHỎ HƠN */
        .summary-total {
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            margin-top: 18px;
            padding: 14px 20px;
            background: #fef9e3;
            border-radius: 20px;
            border: 2px solid #e2b53c;
            color: #b45309;
        }
        .summary-total span {
            font-size: 1.8rem;
            background: white;
            padding: 4px 18px;
            border-radius: 40px;
            margin-left: 12px;
        }

        /* Dòng cảm ơn và giới thiệu - NHỎ HƠN */
        .summary-closing-remarks {
            margin: 20px 0 14px;
            text-align: center;
            background: #fff7e6;
            padding: 12px;
            border-radius: 40px;
        }
        .summary-closing-remarks p {
            font-size: 1.1rem;
            font-weight: 700;
            color: #c2410c;
            margin: 4px 0;
        }

        /* Nút quay lại & Lưu (chụp màn hình) */
        .summary-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 18px;
            margin-top: 20px;
        }
        .back-button, .save-screenshot-btn {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 44px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .save-screenshot-btn {
            background-color: #0f6e3f;
            background: linear-gradient(105deg, #0f6e3f, #2b8c5e);
        }
        .save-screenshot-btn:hover {
            background: #0a5a34;
            transform: scale(0.97);
        }
        .back-button:hover {
            background-color: #1e293b;
            transform: scale(0.97);
        }

        /* Ẩn nút khi chụp ảnh */
        .summary-section.capturing .summary-buttons {
            display: none !important;
        }

        /* Message box */
        .message-box-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .message-box {
            background: white;
            border-radius: 32px;
            padding: 28px 32px;
            text-align: center;
            max-width: 380px;
            width: 85%;
            border-top: 8px solid #dc2626;
        }
        .message-box p {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 24px;
            color: #b91c1c;
        }
        .message-box button {
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 750px) {
            body { padding: 10px; }
            .container, .summary-section { padding: 14px; }
            .product-list-header, .product-item { gap: 6px; flex-wrap: nowrap; }
            .name-header, .name-field { flex: 1.6; min-width: 80px; font-size: 0.75rem; }
            .quantity-header, .quantity-field { flex: 0.7; min-width: 60px; font-size: 0.75rem; }
            .price-header, .price-field { flex: 1; min-width: 70px; font-size: 0.75rem; }
            .remove-header { flex: 0.4; min-width: 40px; }
            .remove-product-button { flex: 0.4; min-width: 40px; font-size: 0.6rem; padding: 6px 0; }
            .product-field input { padding: 8px 4px; font-size: 0.75rem; }

            /* PHIẾU XUẤT - NHỎ GỌN TRÊN ĐIỆN THOẠI */
            .summary-header .company-name { font-size: 1.4rem; }
            .summary-header .branch-info { font-size: 0.8rem; }
            .contact-info { font-size: 0.85rem; }
            .doc-title { font-size: 1.5rem !important; }

            .customer-and-date-details { 
                font-size: 0.85rem; 
                padding: 8px 12px;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .customer-and-date-details div { font-size: 0.85rem; }
            #summaryCustomerName, #summarySaleDate { 
                font-size: 0.85rem;
                padding: 2px 8px;
            }

            .product-block .product-name { font-size: 1.0rem; }
            .product-block .product-details { flex-wrap: wrap; gap: 4px; }
            .product-block .product-details .price-col { flex: 0 0 35%; }
            .product-block .product-details .price-col .value { font-size: 0.95rem; }
            .product-block .product-details .qty-col { flex: 0 0 20%; }
            .product-block .product-details .qty-col .label { font-size: 0.85rem; }
            .product-block .product-details .qty-col .value { font-size: 0.95rem; }
            /* Thành tiền canh phải trên điện thoại */
            .product-block .product-details .subtotal-col { 
                flex: 0 0 35%; 
                font-size: 0.95rem;
                text-align: right !important;
            }

            .summary-total { font-size: 1.2rem; padding: 10px 14px; }
            .summary-total span { font-size: 1.3rem; padding: 2px 12px; margin-left: 8px; }

            .summary-closing-remarks p { font-size: 0.85rem; }
            .summary-buttons { flex-direction: column; gap: 10px; }
            .back-button, .save-screenshot-btn { 
                padding: 10px 16px; 
                font-size: 0.85rem;
                width: 100%;
                text-align: center;
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .summary-section, .summary-section * {
                visibility: visible;
            }
            .summary-section {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 0.5cm;
                box-shadow: none;
            }
            .summary-buttons, .back-button, .save-screenshot-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Phần nhập sản phẩm -->
    <div class="container" id="productListSection">
        <h1>PHIẾU XUẤT KHO</h1>

        <div class="customer-input-section">
            <div>
                <label for="customerNameInput">👤 Tên khách hàng:</label>
                <input type="text" id="customerNameInput" placeholder="Nhập tên khách hàng / đơn vị">
            </div>
            <div>
                <label for="saleDateInput">📅 Ngày xuất:</label>
                <input type="date" id="saleDateInput">
            </div>
        </div>

        <!-- Bảng nhập hàng hóa -->
        <div class="product-list-header">
            <div class="name-header">📌 Tên sản phẩm</div>
            <div class="price-header">💰 Đơn giá</div>
            <div class="quantity-header">🔢 SL</div>
            <div class="remove-header"></div>
        </div>
        <div id="dynamicProductList"></div>

        <button class="add-product-button" onclick="addProductRow()">+ Thêm dòng sản phẩm</button>
        <button class="calculate-button" onclick="calculateTotal()">💵 THÀNH TIỀN & XEM PHIẾU XUẤT</button>
    </div>

    <!-- PHIẾU XUẤT KHO -->
    <div class="summary-section" id="summarySection">
        <div class="summary-header">
            
            <p class="company-name">NGỌC HƯƠNG</p>
            <p class="branch-info">Chuyên Sỉ - Lẻ các loại hàng Hóa Mỹ Phẩm</p>
            <p class="contact-info">MB Bank - 0990173529999 - Trần Thị Hương</p>
            <p class="contact-info">DĐ: 0967.750.989 (Hương) - 0705.919.559 (Phước)</p>

            <div class="customer-and-date-details">
                <div>🧾 Tên khách hàng: <span id="summaryCustomerName"></span></div>
                <div>📆 Ngày xuất: <span id="summarySaleDate"></span></div>
            </div>
        </div>

        <!-- Danh sách sản phẩm dạng block -->
        <div class="summary-products" id="summaryProducts">
            <!-- JS sẽ chèn các block sản phẩm -->
        </div>

        <div class="summary-total">
            TỔNG TIỀN: <span id="totalAmount">0</span>
        </div>

        <div class="summary-closing-remarks">
          
            <p>Cảm ơn quý khách. Hẹn gặp lại !</p>
        </div>
        <div class="summary-buttons">
            <button class="back-button" id="backButton" onclick="goBackToProductList()">⬅ Quay lại chỉnh sửa</button>
            <button class="save-screenshot-btn" id="saveScreenshotBtn">📸 LƯU (chụp ảnh phiếu)</button>
        </div>
    </div>

    <!-- Message Box thông báo -->
    <div class="message-box-overlay" id="messageBoxOverlay">
        <div class="message-box">
            <p id="messageText"></p>
            <button onclick="hideMessageBox()">Đóng</button>
        </div>
    </div>

    <script>
        let productRowCounter = 0;

        // DOM ready: set ngày mặc định + thêm 1 dòng sản phẩm
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('saleDateInput').value = `${yyyy}-${mm}-${dd}`;
            addProductRow();
        });

        function createProductRow() {
            productRowCounter++;
            const productDiv = document.createElement('div');
            productDiv.classList.add('product-item');
            productDiv.setAttribute('data-id', productRowCounter);
            productDiv.innerHTML = `
                <div class="product-field name-field">
                    <input type="text" class="product-name-input" placeholder="VD: Khẩu trang KF94" id="prodName_${productRowCounter}">
                </div>
                <div class="product-field price-field">
                    <input type="number" class="product-price-input" value="0" min="0" step="1000" id="prodPrice_${productRowCounter}">
                </div>
                <div class="product-field quantity-field">
                    <input type="number" class="quantity-input" value="0" min="0" step="1" id="prodQty_${productRowCounter}">
                </div>
                <button class="remove-product-button" onclick="removeProductRow(this)">🗑 Xóa</button>
            `;
            const qtyInput = productDiv.querySelector('.quantity-input');
            const priceInput = productDiv.querySelector('.product-price-input');
            if(qtyInput) qtyInput.addEventListener('focus', function() { if(this.value === '0') this.value = ''; });
            if(priceInput) priceInput.addEventListener('focus', function() { if(this.value === '0') this.value = ''; });
            return productDiv;
        }

        function addProductRow() {
            const container = document.getElementById('dynamicProductList');
            container.appendChild(createProductRow());
        }

        function removeProductRow(btn) {
            const row = btn.closest('.product-item');
            const parentList = document.getElementById('dynamicProductList');
            if(parentList.children.length > 1) {
                row.remove();
            } else {
                const nameInput = row.querySelector('.product-name-input');
                const qtyInput = row.querySelector('.quantity-input');
                const priceInput = row.querySelector('.product-price-input');
                if(nameInput) nameInput.value = '';
                if(qtyInput) qtyInput.value = '0';
                if(priceInput) priceInput.value = '0';
                showMessageBox("⚠️ Phải có ít nhất một dòng sản phẩm. Đã đặt lại dòng này.");
                setTimeout(() => hideMessageBox(), 1500);
            }
        }

        function showMessageBox(msg) {
            const overlay = document.getElementById('messageBoxOverlay');
            const textEl = document.getElementById('messageText');
            textEl.innerText = msg;
            overlay.style.display = 'flex';
        }
        function hideMessageBox() {
            document.getElementById('messageBoxOverlay').style.display = 'none';
        }

        // Format số
        function formatNumber(amount) {
            return amount.toLocaleString('vi-VN');
        }

        // Hàm tính tổng và tạo phiếu xuất
        function calculateTotal() {
            const productRows = document.querySelectorAll('#dynamicProductList .product-item');
            const summaryContainer = document.getElementById('summaryProducts');
            let totalAmount = 0;
            let summaryHtml = '';

            const rawCustomer = document.getElementById('customerNameInput').value.trim();
            const saleDateRaw = document.getElementById('saleDateInput').value;
            const customerDisplay = rawCustomer === "" ? "................................" : rawCustomer;
            document.getElementById('summaryCustomerName').innerText = customerDisplay;

            if(saleDateRaw) {
                const [year, month, day] = saleDateRaw.split('-');
                document.getElementById('summarySaleDate').innerText = `${day}/${month}/${year}`;
            } else {
                document.getElementById('summarySaleDate').innerText = "____/____/____";
            }

            let stt = 1;
            for(let row of productRows) {
                const productName = row.querySelector('.product-name-input')?.value.trim();
                let quantity = parseInt(row.querySelector('.quantity-input')?.value) || 0;
                let unitPrice = parseFloat(row.querySelector('.product-price-input')?.value) || 0;

                if(productName && quantity > 0 && unitPrice >= 0) {
                    const subtotal = quantity * unitPrice;
                    totalAmount += subtotal;
                    summaryHtml += `
                        <div class="product-block">
                            <div class="product-name">${stt++}. ${escapeHtml(productName)}</div>
                            <div class="product-details">
                                <span class="detail-item price-col"><span class="label"></span> <span class="value">${formatNumber(unitPrice)}</span></span>
                                <span class="detail-item qty-col"><span class="label">SL: </span><span class="value">${quantity}</span></span>
                                <span class="detail-item subtotal-col">${formatNumber(subtotal)}</span>
                            </div>
                        </div>
                    `;
                }
            }

            if(summaryHtml === "") {
                showMessageBox("❌ Vui lòng nhập ít nhất một sản phẩm hợp lệ (có tên và số lượng > 0)");
                return;
            }

            summaryContainer.innerHTML = summaryHtml;
            document.getElementById('totalAmount').innerHTML = formatNumber(totalAmount);

            document.getElementById('productListSection').style.display = 'none';
            document.getElementById('summarySection').style.display = 'block';
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        function goBackToProductList() {
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('productListSection').style.display = 'block';
        }

        // HÀM CHỤP MÀN HÌNH
        async function captureAndSaveVoucher() {
            const summaryElement = document.getElementById('summarySection');
            if (!summaryElement) return;

            const saveBtn = document.querySelector('.save-screenshot-btn');
            const originalText = saveBtn.innerText;
            saveBtn.innerText = '📸 Đang chụp...';
            saveBtn.disabled = true;

            try {
                // Thêm class để ẩn nút
                summaryElement.classList.add('capturing');
                
                await new Promise(resolve => setTimeout(resolve, 200));
                
                const canvas = await html2canvas(summaryElement, {
                    scale: 4.5,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: false,
                    allowTaint: false,
                    width: summaryElement.scrollWidth,
                    height: summaryElement.scrollHeight,
                    windowWidth: summaryElement.scrollWidth,
                    windowHeight: summaryElement.scrollHeight
                });
                
                // Xóa class để hiện lại nút
                summaryElement.classList.remove('capturing');
                
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                link.download = `Phieu_Xuat_Kho_${timestamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showMessageBox("✅ Đã lưu ảnh phiếu xuất kho thành công!");
                setTimeout(() => hideMessageBox(), 1800);
            } catch (err) {
                console.error(err);
                summaryElement.classList.remove('capturing');
                showMessageBox("⚠️ Lỗi khi chụp ảnh, vui lòng thử lại.");
                setTimeout(() => hideMessageBox(), 1800);
            } finally {
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
        }

        document.addEventListener('click', function(e) {
            if(e.target && e.target.id === 'saveScreenshotBtn') {
                captureAndSaveVoucher();
            }
        });

        window.printSummary = function() {
            captureAndSaveVoucher();
        };
    </script>
</body>
</html>
